<!DOCTYPE html>
<html>
<head>
    <title>Stickman Golf Duel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🏌️ Stickman Golf Duel ⚔️</h1>

<div id="score">
    <div>
        Player 1 Shield:
        <span id="shield1">10</span>
    </div>

    <div>
        Player 2 Shield:
        <span id="shield2">10</span>
    </div>
</div>


<div id="powerBox">
    Power:
    <div id="meter">
        <div id="power"></div>
    </div>
</div>


<canvas id="gameCanvas" width="1200" height="600"></canvas>


<p>
Player 1:
<b>A</b> = backswing |
<b>D</b> = hit
<br>

Player 2:
<b>←</b> = backswing |
<b>→</b> = hit
</p>


<button onclick="restartGame()">Restart</button>


<script src="game.js"></script>

</body>
</html>
